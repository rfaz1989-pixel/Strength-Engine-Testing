<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Workout</title>

<style>
body {
  font-family: system-ui;
  background:#111;
  color:#eee;
  padding:16px;
}

.card {
  background:#1c1c1c;
  padding:16px;
  border-radius:8px;
  max-width:900px;
  margin:auto;
}

h3 {
  margin-top:20px;
}

.section-title {
  margin-top:12px;
  font-weight:600;
}

table {
  width:100%;
  border-collapse:collapse;
  margin-bottom:12px;
}

td, th {
  border:1px solid #333;
  padding:6px;
  text-align:center;
}

button {
  padding:6px 10px;
  border:none;
  border-radius:4px;
  cursor:pointer;
}

.complete {
  background:#22c55e;
}

.failed {
  background:#ef4444;
}

.active {
  outline:3px solid white;
}

.log-btn {
  width:100%;
  padding:12px;
  font-size:1rem;
  font-weight:600;
  background:#3b82f6;
  color:white;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="card">
  <h2 id="title"></h2>
  <p id="date"></p>

  <div id="exercise-container"></div>

  <button class="log-btn" onclick="logWorkout()">Log Workout</button>
</div>

<script>
/* ---------------- LOAD ACTIVE WORKOUT ---------------- */

const workout = JSON.parse(localStorage.getItem("activeWorkout"));

if (!workout || !workout.exercises) {
  alert("No active workout found.");
  window.location.href = "index.html";
}

document.getElementById("title").innerText =
  `${workout.program} – ${workout.workout}`;

document.getElementById("date").innerText = workout.date;

const container = document.getElementById("exercise-container");

/* ---------------- RENDER WORKOUT ---------------- */

workout.exercises.forEach((exercise, exIndex) => {
  const block = document.createElement("div");
  block.innerHTML = `<h3>${exercise.name}</h3>`;

  renderSection(block, "Warm-up Sets", exercise.warmup, exIndex, "warmup");
  renderSection(block, "Working Sets", exercise.work, exIndex, "work");

  container.appendChild(block);
});

function renderSection(parent, title, sets, exIndex, key) {
  if (!sets || sets.length === 0) return;

  let html = `
    <div class="section-title">${title}</div>
    <table>
      <tr>
        <th>Set</th>
        <th>Target</th>
        <th>Actual</th>
        <th>Reps</th>
        <th>Status</th>
      </tr>
  `;

  sets.forEach((set, setIndex) => {
    html += `
      <tr>
        <td>${setIndex + 1}</td>
        <td>${set.target}</td>
        <td>
          <input type="number" value="${set.actual}"
            onchange="updateActual(${exIndex}, '${key}', ${setIndex}, this.value)">
        </td>
        <td>${set.reps}</td>
        <td>
          <button class="complete"
            onclick="setStatus(${exIndex}, '${key}', ${setIndex}, 'complete', this)">✔</button>
          <button class="failed"
            onclick="setStatus(${exIndex}, '${key}', ${setIndex}, 'failed', this)">✖</button>
        </td>
      </tr>
    `;
  });

  html += "</table>";
  parent.innerHTML += html;
}

/* ---------------- INTERACTION ---------------- */

function updateActual(exIndex, key, setIndex, value) {
  workout.exercises[exIndex][key][setIndex].actual = Number(value);
}

function setStatus(exIndex, key, setIndex, status, btn) {
  workout.exercises[exIndex][key][setIndex].status = status;

  // visual toggle
  const buttons = btn.parentElement.querySelectorAll("button");
  buttons.forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

/* ---------------- LOG WORKOUT ---------------- */

function logWorkout() {
  // Normalize data (future-proofing)
  workout.exercises = workout.exercises.map(ex => ({
    name: ex.name,
    warmup: ex.warmup || [],
    work: ex.work || []
  }));

  const history =
    JSON.parse(localStorage.getItem("strengthEngineHistory")) || [];

  history.push(workout);

  localStorage.setItem(
    "strengthEngineHistory",
    JSON.stringify(history)
  );

  localStorage.removeItem("activeWorkout");
  window.location.href = "index.html";
}
</script>

</body>
</html>
