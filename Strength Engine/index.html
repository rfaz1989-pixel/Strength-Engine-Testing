<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Strength Engine</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #111;
  color: #eee;
  margin: 0;
  padding: 16px;
}
h1 { text-align: center; margin-bottom: 4px; }
.subtitle { text-align: center; color: #aaa; margin-bottom: 20px; }

.card {
  background: #1c1c1c;
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 16px;
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}

details {
  background: #161616;
  border-radius: 6px;
  padding: 8px;
}

summary {
  cursor: pointer;
  font-weight: 600;
}

button {
  width: 100%;
  padding: 6px;
  margin-top: 8px;
  background: #3b82f6;
  color: #eee;
  border: 1px solid #444;
  border-radius: 4px;
  font-weight: 600;
  cursor: pointer;
}

button.secondary { background: #16a34a; }
button.fail { background: #dc2626; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}

th, td {
  border: 1px solid #333;
  padding: 6px;
  text-align: center;
}

th { background: #222; }

.table-input { width: 70px; text-align: center; }

.set-complete { background: rgba(22,163,74,0.25); }
.set-failed { background: rgba(220,38,38,0.25); }
</style>
</head>

<body>

<h1>Strength Engine</h1>
<div class="subtitle">Program-driven strength training</div>

<!-- MAIN / PLAN VIEW -->
<div id="plan-view">

  <div class="card">
    <h2>Program Selection</h2>
    <select id="program">
      <option value="531">5/3/1 Volumizing</option>
      <option value="5x5">5×5 Linear</option>
    </select>
    <select id="week"></select>
    <button onclick="generatePlan()">Generate Plan</button>
  </div>

  <div class="card" id="plan-output"></div>

  <!-- WORKOUT LOG DROPDOWN -->
  <div class="card">
    <details>
      <summary>Workout Log</summary>
      <div id="log-list"></div>
    </details>
  </div>
</div>

<!-- WORKOUT EXECUTION VIEW -->
<div id="workout-view" style="display:none;">
  <div class="card">
    <h2 id="workout-title"></h2>

    <label>Workout Date</label>
    <input type="date" id="workout-date">

    <div id="workout-body"></div>

    <button class="secondary" onclick="logWorkout()">Log Workout</button>
    <button onclick="backToMain()">Back to Main</button>
  </div>
</div>

<!-- LOG DETAIL VIEW -->
<div id="log-detail-view" style="display:none;">
  <div class="card">
    <h2>Logged Workout</h2>
    <div id="log-detail-body"></div>
    <button onclick="backToMain()">Back to Main</button>
  </div>
</div>

<script>
let activeWorkout = null;

function populateWeeks() {
  const program = document.getElementById("program").value;
  const week = document.getElementById("week");
  week.innerHTML = "";
  (program === "531" ? [1,2,3,4] : [1,2]).forEach(w => {
    week.innerHTML += `<option value="${w}">Week ${w}</option>`;
  });
}
populateWeeks();
document.getElementById("program").onchange = populateWeeks;

function generatePlan() {
  const program = program.value;
  const week = document.getElementById("week").value;
  let html = "";

  const days531 = ["Day 1","Day 2","Day 3","Day 4"];
  const order5x5 = week === "1" ? ["A","B","A"] : ["B","A","B"];

  if (program === "531") {
    days531.forEach((d,i) => {
      html += `
        <div class="card">
          <h3>${d}</h3>
          <button class="secondary" onclick="startWorkout('${program}',${week},${i})">Start Workout</button>
        </div>`;
    });
  } else {
    order5x5.forEach((w,i) => {
      html += `
        <div class="card">
          <h3>Workout ${w}</h3>
          <button class="secondary" onclick="startWorkout('${program}',${week},${i})">Start Workout</button>
        </div>`;
    });
  }

  document.getElementById("plan-output").innerHTML = html;
}

function startWorkout(program, week, index) {
  activeWorkout = {
    program,
    week,
    index,
    date: new Date().toISOString().slice(0,10),
    sets: []
  };

  document.getElementById("plan-view").style.display = "none";
  document.getElementById("workout-view").style.display = "block";
  document.getElementById("workout-date").value = activeWorkout.date;
  document.getElementById("workout-title").textContent = `${program} – Week ${week}`;
}

function logWorkout() {
  activeWorkout.date = document.getElementById("workout-date").value;
  const log = JSON.parse(localStorage.getItem("strength_engine_log") || "[]");
  log.push(activeWorkout);
  localStorage.setItem("strength_engine_log", JSON.stringify(log));
  renderLog();
  backToMain();
}

function renderLog() {
  const log = JSON.parse(localStorage.getItem("strength_engine_log") || "[]");
  const list = document.getElementById("log-list");
  list.innerHTML = log.length
    ? log.map((w,i)=>`
        <div>
          <button onclick="openLog(${i})">
            ${w.date} – ${w.program} Week ${w.week}
          </button>
        </div>`).join("")
    : "<p>No workouts logged.</p>";
}

function openLog(index) {
  const log = JSON.parse(localStorage.getItem("strength_engine_log"));
  const w = log[index];

  document.getElementById("plan-view").style.display = "none";
  document.getElementById("log-detail-view").style.display = "block";

  document.getElementById("log-detail-body").innerHTML = `
    <strong>Date:</strong> ${w.date}<br>
    <strong>Program:</strong> ${w.program}<br>
    <strong>Week:</strong> ${w.week}
  `;
}

function backToMain() {
  document.getElementById("workout-view").style.display = "none";
  document.getElementById("log-detail-view").style.display = "none";
  document.getElementById("plan-view").style.display = "block";
}

renderLog();
</script>

</body>
</html>
